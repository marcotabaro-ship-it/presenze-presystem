<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1D2730">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lavoro">
  <title>Lavoro Pre System</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.2.0">
</head>
<body>
  <header class="testata">
    <button class="btn-menu" type="button" onclick="alternaMenu()" aria-label="Apri o compatta il menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="btn-logo" type="button" onclick="vaiHome()" aria-label="Vai al calendario">
      <img class="testata-icona" src="icons/icon-192.png" alt="">
    </button>
    <div class="testata-txt">
      <div class="testata-app">Lavoro</div>
      <div class="testata-nome" id="statoSync">Pre System</div>
    </div>
    <button class="btn-testata" id="btnAggiorna" type="button" onclick="sincronizza(false)">Aggiorna</button>
  </header>

  <aside class="laterale" aria-label="Menu">
    <button type="button" class="menu-voce" data-vista="home" onclick="vai('home')" title="Calendario">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      <span>Calendario</span>
    </button>
    <button type="button" class="menu-voce" data-vista="nuova" onclick="vai('nuova')" title="Nuova">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Nuova</span>
    </button>
    <button type="button" class="menu-voce" data-vista="richieste" onclick="vai('richieste')" title="Richieste">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.5h12M8 12h12M8 17.5h12"/><circle cx="4.5" cy="6.5" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="17.5" r="1"/></svg>
      <span>Richieste</span>
    </button>
    <button type="button" class="menu-voce" data-vista="rapportino" onclick="vai('rapportino')" title="Rapportino">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6"/></svg>
      <span>Rapportino</span>
    </button>
    <button type="button" class="menu-voce" data-vista="fascicolo" onclick="vai('fascicolo')" title="Fascicolo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5v11a1.5 1.5 0 0 0 1.5 1.5h14a1.5 1.5 0 0 0 1.5-1.5v-9a1.5 1.5 0 0 0-1.5-1.5h-7l-2-2.5H5A1.5 1.5 0 0 0 3.5 7.5z"/><path d="M12 11.5v4M10 13.5h4"/></svg>
      <span>Fascicolo</span>
    </button>
    <div class="menu-separatore"></div>
    <button type="button" class="menu-voce" data-vista="impostazioni" onclick="vai('impostazioni')" title="Impostazioni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
      <span>Impostazioni</span>
    </button>
  </aside>

  <main class="contenuto">
    <section class="vista" id="v-collega"></section>
    <section class="vista" id="v-home"></section>
    <section class="vista" id="v-nuova"></section>
    <section class="vista" id="v-richieste"></section>
    <section class="vista" id="v-rapportino"></section>
    <section class="vista" id="v-fascicolo"></section>
    <section class="vista" id="v-impostazioni"></section>
  </main>

  <nav class="schede" id="schede" aria-label="Sezioni">
    <button type="button" class="scheda" data-vista="home" onclick="vai('home')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      <span>Calendario</span>
    </button>
    <button type="button" class="scheda" data-vista="nuova" onclick="vai('nuova')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Nuova</span>
    </button>
    <button type="button" class="scheda" data-vista="richieste" onclick="vai('richieste')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.5h12M8 12h12M8 17.5h12"/><circle cx="4.5" cy="6.5" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="17.5" r="1"/></svg>
      <span>Richieste</span>
    </button>
    <button type="button" class="scheda" data-vista="rapportino" onclick="vai('rapportino')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6"/></svg>
      <span>Rapportino</span>
    </button>
    <button type="button" class="scheda" data-vista="fascicolo" onclick="vai('fascicolo')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5v11a1.5 1.5 0 0 0 1.5 1.5h14a1.5 1.5 0 0 0 1.5-1.5v-9a1.5 1.5 0 0 0-1.5-1.5h-7l-2-2.5H5A1.5 1.5 0 0 0 3.5 7.5z"/><path d="M12 11.5v4M10 13.5h4"/></svg>
      <span>Fascicolo</span>
    </button>
    <button type="button" class="scheda" data-vista="impostazioni" onclick="vai('impostazioni')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
      <span>Impostazioni</span>
    </button>
  </nav>

  <div class="velo nascosto" id="velo" onclick="chiudiFoglio()"></div>
  <div class="foglio nascosto" id="foglio" role="dialog" aria-modal="true"></div>
  <div class="avviso" id="avviso" role="status" aria-live="polite"></div>
  <div class="attesa nascosto" id="attesa"><div class="attesa-barra"></div></div>

  <script src="app.js?v=2.2.0"></script>
  <script src="pasti.js?v=2.2.0"></script>
  <script src="fascicolo.js?v=2.2.0"></script>
</body>
</html>
